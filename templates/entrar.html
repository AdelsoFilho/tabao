{% extends "base.html" %}
{% block titulo %}Entrar — TáBão{% endblock %}
{% block conteudo %}

<h1>Entrar</h1>
<p class="sub">Com a conta, o cálculo do combustível usa os dados do seu carro.</p>

<form class="cartao form-conta" method="post" action="{{ url_for('entrar') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="proximo" value="{{ proximo }}">

  <label for="email">E-mail</label>
  <input type="email" id="email" name="email" value="{{ email }}" required autocomplete="email" autofocus>

  <label for="senha">Senha</label>
  <input type="password" id="senha" name="senha" required autocomplete="current-password">

  <button class="botao grande" type="submit">Entrar</button>
</form>

<p class="rodape-conta">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>

{% endblock %}
