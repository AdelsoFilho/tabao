# Roda a suíte a cada push e em cada pull request.
#
# Existe por causa do sefaz.py, que é o módulo frágil do projeto: ele depende
# do HTML do portal da SEFAZ e quebra quando o layout muda. Os testes usam
# páginas reais gravadas em tests/fixtures, então rodam sem rede e sem depender
# de o portal estar no ar — o que os torna adequados para rodar aqui.

name: Testes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma versão declarada em runtime.txt.
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        # Sem SECRET_KEY e sem marca de hospedagem no ambiente, o app sorteia
        # uma chave para a execução — que é o comportamento esperado aqui.
        run: python -m pytest -q
